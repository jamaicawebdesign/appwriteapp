<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Secure user dashboard"
    >

    <title>Dashboard — Appwrite App</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            font-family: Inter, system-ui, sans-serif;
            color: #101828;
            background: #f5f7fb;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 10% 10%,
                    #e7efff 0,
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    #e8f8f1 0,
                    transparent 30%
                ),
                #f7f8fc;
        }

        .dashboard {
            width: min(100% - 32px, 1000px);
            margin: 0 auto;
            padding: 40px 0;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            display: flex;
            gap: 3px;
        }

        .brand-mark span {
            width: 7px;
            height: 22px;
            border-radius: 6px;
            background: #111827;
            transform: skew(-18deg);
        }

        .brand-mark span:nth-child(2) {
            height: 29px;
            margin-top: -3px;
            background: #4f46e5;
        }

        .brand-mark span:nth-child(3) {
            background: #10b981;
        }

        .brand-name {
            font-size: 15px;
            font-weight: 800;
        }

        .logout {
            border: 1px solid #d0d5dd;
            background: white;
            color: #344054;
            border-radius: 10px;
            padding: 10px 16px;
            font: 600 13px Inter, sans-serif;
            cursor: pointer;
            transition: .18s;
        }

        .logout:hover {
            background: #f9fafb;
        }

        .welcome {
            margin-bottom: 24px;
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: .16em;
            font-weight: 800;
            color: #667085;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 40px);
            letter-spacing: -.04em;
        }

        .subtitle {
            color: #667085;
            margin: 9px 0 0;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .card {
            background: rgba(255, 255, 255, .94);
            border: 1px solid #e5e9f2;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 15px 40px rgba(16, 24, 40, .06);
        }

        .profile {
            grid-column: span 2;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin-bottom: 16px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 24px;
            font-weight: 800;
        }

        .card-label {
            color: #667085;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .card-value {
            font-size: 16px;
            font-weight: 700;
            word-break: break-word;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #027a48;
            font-size: 13px;
            font-weight: 700;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #12b76a;
        }

        .loading {
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: #667085;
            font-size: 14px;
        }

        .loading-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 28px;
            background: rgba(255,255,255,.94);
            border: 1px solid #e5e9f2;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(16,24,40,.06);
        }

        .loading-card span {
            color: #667085;
            font-size: 12px;
        }

        .loading-spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #e5e7eb;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: dashboardSpin .7s linear infinite;
        }

        .auth-error {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .error-card {
            width: min(100%, 460px);
            padding: 28px;
            text-align: center;
            background: white;
            border: 1px solid #fecdca;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(16,24,40,.08);
        }

        .error-card strong {
            font-size: 18px;
        }

        .error-card p {
            color: #667085;
            font-size: 13px;
            line-height: 1.6;
        }

        .error-card button {
            border: 0;
            border-radius: 10px;
            padding: 11px 18px;
            background: #111827;
            color: white;
            font: 600 13px Inter, sans-serif;
            cursor: pointer;
        }

        @keyframes dashboardSpin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 700px) {
            .dashboard {
                padding: 24px 0;
            }

            .header {
                align-items: flex-start;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .profile {
                grid-column: span 1;
            }
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
            }

            .logout {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div id="loading" class="loading">
        <div class="loading-card">
            <div class="loading-spinner" aria-hidden="true"></div>
            <strong>Loading your dashboard...</strong>
            <span id="loadingStatus">Checking your Appwrite session.</span>
        </div>
    </div>

    <div id="authError" class="auth-error" hidden>
        <div class="error-card">
            <strong>We couldn't load your dashboard.</strong>
            <p id="authErrorMessage">Your session could not be verified.</p>
            <button id="returnLogin" type="button">Return to login</button>
        </div>
    </div>

    <main id="dashboard" class="dashboard" hidden>

        <header class="header">

            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <span class="brand-name">
                    Appwrite App
                </span>
            </div>

            <button
                id="logoutButton"
                class="logout"
                type="button"
            >
                Log out
            </button>

        </header>

        <section class="welcome">

            <div class="eyebrow">
                DASHBOARD
            </div>

            <h1>
                Welcome, <span id="userName">User</span>
            </h1>

            <p class="subtitle">
                Your account is securely authenticated with Appwrite.
            </p>

        </section>

        <section class="grid">

            <article class="card profile">

                <div
                    id="avatar"
                    class="avatar"
                >
                    U
                </div>

                <div class="card-label">
                    Account name
                </div>

                <div
                    id="profileName"
                    class="card-value"
                >
                    —
                </div>

                <br>

                <div class="card-label">
                    Email address
                </div>

                <div
                    id="userEmail"
                    class="card-value"
                >
                    —
                </div>

            </article>

            <article class="card">

                <div class="card-label">
                    Authentication
                </div>

                <div class="status">
                    <span class="status-dot"></span>
                    Authenticated
                </div>

            </article>

            <article class="card">

                <div class="card-label">
                    User ID
                </div>

                <div
                    id="userId"
                    class="card-value"
                >
                    —
                </div>

            </article>

        </section>

    </main>

   

<script src="https://cdn.jsdelivr.net/npm/appwrite@28.1.0"></script>


<script>
    console.log("Dashboard JavaScript starting...");

    const APPWRITE_ENDPOINT =
        "https://fra.cloud.appwrite.io/v1";

    const APPWRITE_PROJECT_ID =
        "6ac5a6a70015601de61a";

    const {
        Client,
        Account
    } = Appwrite;

    const client = new Client();

    client
        .setEndpoint(APPWRITE_ENDPOINT)
        .setProject(APPWRITE_PROJECT_ID);

    const account = new Account(client);

    const loading = document.getElementById("loading");
    const dashboard = document.getElementById("dashboard");
    const authError = document.getElementById("authError");
    const loadingStatus = document.getElementById("loadingStatus");
    const authErrorMessage = document.getElementById("authErrorMessage");

    function showAuthError(message) {
        loading.hidden = true;
        dashboard.hidden = true;
        authError.hidden = false;
        authErrorMessage.textContent = message;
    }

    async function loadDashboard() {
        console.log("Checking Appwrite session...");

        try {
            loadingStatus.textContent = "Verifying your authenticated session.";

            // Prevent an indefinite loading screen if the browser/network
            // request never resolves.
            const user = await Promise.race([
                account.get(),
                new Promise((_, reject) =>
                    setTimeout(
                        () => reject(new Error(
                            "The Appwrite session check timed out. Check your network connection and Appwrite Web platform settings."
                        )),
                        10000
                    )
                )
            ]);

            console.log("Authenticated user:", user);

            const name = user.name || "User";

            document.getElementById("userName").textContent = name;
            document.getElementById("profileName").textContent = name;
            document.getElementById("userEmail").textContent = user.email || "—";
            document.getElementById("userId").textContent = user.$id;
            document.getElementById("avatar").textContent =
                name.trim().charAt(0).toUpperCase() || "U";

            loading.hidden = true;
            dashboard.hidden = false;

        } catch (error) {
            console.error("Dashboard authentication error:", error);

            const code = error?.code;
            if (code === 401) {
                showAuthError("Your Appwrite session is no longer active. Please sign in again.");
            } else if (error?.message) {
                showAuthError(error.message);
            } else {
                showAuthError("We could not verify your Appwrite session. Please try again.");
            }
        }
    }

    document
        .getElementById("returnLogin")
        .addEventListener("click", () => {
            window.location.replace("index.html");
        });

    document
        .getElementById("logoutButton")
        .addEventListener("click", async () => {
            try {
                await account.deleteSession("current");
                window.location.replace("index.html");
            } catch (error) {
                console.error("Logout error:", error);
                showAuthError(
                    error?.message || "Unable to log out. Please try again."
                );
            }
        });

    loadDashboard();
</script>


</body>
</html>
