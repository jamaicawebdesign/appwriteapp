<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Modern Appwrite authentication page with sign up and login.">
  <title>Secure Account — Appwrite Auth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@28.1.0"></script>
</head>
<body>
  <main class="page-shell">
    <section class="auth-card" aria-label="Account authentication">
      <div class="brand-mark"><span></span><span></span><span></span></div>
      <div class="eyebrow">SECURE ACCESS</div>
      <h1 id="formTitle">Welcome back</h1>
      <p class="subtitle" id="formSubtitle">Sign in to continue to your account.</p>

      <div class="tabs" role="tablist" aria-label="Authentication options">
        <button class="tab active" id="loginTab" role="tab" aria-selected="true">Log in</button>
        <button class="tab" id="signupTab" role="tab" aria-selected="false">Create account</button>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="authForm" novalidate>
        <div class="field" id="nameField" hidden>
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name">
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <button type="button" class="text-button" id="togglePassword">Show</button>
          </div>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required>
        </div>

        <div class="field" id="confirmField" hidden>
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password">
        </div>

        <div class="form-options" id="loginOptions">
          <label class="check"><input type="checkbox" id="remember"> <span>Keep me signed in</span></label>
          <span class="hint">Appwrite manages the session securely.</span>
        </div>

        <button class="submit" id="submitButton" type="submit">
          <span id="submitText">Log in</span>
          <span class="spinner" id="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="logged-in" id="loggedIn" hidden>
        <div class="avatar" id="avatar">U</div>
        <h2>You’re signed in</h2>
        <p id="accountInfo"></p>
        <button class="submit secondary" id="logoutButton" type="button">Log out</button>
      </div>

      <p class="footer-note">Authentication powered by <strong>Appwrite</strong></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/appwrite"></script>
<script src="app.js"></script>

</body>
</html>
